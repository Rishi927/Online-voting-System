<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cast Your Vote</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="card vote-main">
  <h2>🗳️ Cast Your Vote</h2>
  <div id="voteStats" class="vote-stats">
    <div class="stat-box">
      <div>Total Voters</div>
      <div id="totalVoters" class="stat-num">0</div>
    </div>
    <div class="stat-box">
      <div>Already Voted</div>
      <div id="votedVoters" class="stat-num">0</div>
    </div>
  </div>
  <div id="candidates"></div>
  <div id="voteMsg"></div>
</div>
<script src="script.js"></script>
</body>
</html>
